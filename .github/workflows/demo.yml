name: Interactive demo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, energy-graph/index.html, thermostat/index.html, cover/index.html, light/index.html, dev/gallery.css, dev/demo.js, 'docs/images/**', dist/gleam-card.js, .github/workflows/demo.yml]
permissions: {}
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Stage the public demo
        run: |
          mkdir -p site/dev site/dist site/docs
          cp index.html site/
          cp -r energy-graph thermostat cover light site/
          cp -r docs/images site/docs/
          cp dist/gleam-card.js site/dist/
          cp dev/demo.js dev/gallery.css site/dev/
          printf '%s\n' 'import "../dist/gleam-card.js";' 'import "./demo.js";' > site/dev/preview.js
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.site.outputs.page_url }}
    steps:
      - id: site
        uses: actions/deploy-pages@v5.0.1
